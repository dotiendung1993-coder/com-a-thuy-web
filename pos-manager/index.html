<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POS Manager - Cơm A Thuý</title>
  <meta name="theme-color" content="#169939" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/192.png" />
  <link rel="apple-touch-icon" href="./icons/192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="offline-screen" class="offline-screen hidden">
    <div class="offline-box">
      <div class="offline-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 14.3A8.5 8.5 0 0 1 9.7 3.5a8.5 8.5 0 1 0 10.8 10.8z"/>
        </svg>
      </div>
      <h2>Hệ thống đang tạm nghỉ</h2>
      <p>Máy chủ quán hoạt động từ 8:00 đến 22:30.</p>
      <button id="offline-retry" class="btn btn-primary">Thử lại</button>
    </div>
  </div>

  <header id="app-header" class="app-header hidden">
    <span id="app-title">POS Manager</span>
    <span class="app-header-right">
      <span id="app-user"></span>
      <!-- GĐ8 mục K — chuông Trung tâm thông báo, chấm số do js/app.js cập nhật -->
      <button id="app-notif" class="app-notif hidden" type="button" aria-label="Thong bao">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8.5a6 6 0 1 0-12 0c0 6-2 7.5-2 7.5h16s-2-1.5-2-7.5"/>
          <path d="M13.7 20a2 2 0 0 1-3.4 0"/>
        </svg>
        <span id="app-notif-badge" class="app-notif-badge hidden">0</span>
      </button>
    </span>
  </header>

  <!-- Cột trái (máy tính) và thanh dưới (điện thoại) do js/app.js dựng từ js/nav.js,
       vì chủ quán tự chọn được 3 ô giữa của thanh dưới (giống app Sổ Bán Hàng). -->
  <nav id="sidebar" class="sidebar hidden"></nav>

  <main id="view" class="view"></main>

  <nav id="tabbar" class="tabbar hidden"></nav>

  <a id="fab" href="#/ban-hang" class="fab hidden" aria-label="Bán hàng nhanh"></a>

  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
