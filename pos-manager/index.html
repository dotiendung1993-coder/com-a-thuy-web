<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>POS Manager - Cơm A Thuý</title>
  <meta name="theme-color" content="#169939" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/192.png" />
  <link rel="apple-touch-icon" href="./icons/192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/theme-v2.css" />
</head>
<body>
  <div id="offline-screen" class="offline-screen hidden">
    <div class="offline-box">
      <div class="offline-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 8.5C7 4 17 4 22 8.5M5 12.5c3.5-3 10-3 13.5 0M8.5 16.5c2-1.7 5-1.7 7 0"/>
          <path d="M12 20.2v.1"/>
          <path d="M2.5 2.5l19 19" stroke="#e5484d"/>
        </svg>
      </div>
      <h2>Không kết nối được máy chủ</h2>
      <!-- Đợt 4 (16/08/2026) — chữ cũ "hoạt động từ 8:00 đến 22:30" là lời giải thích DỰNG SẴN,
           KHÔNG PHẢI giờ hoạt động thật (app không giới hạn giờ). Màn này hiện ra bất cứ khi nào
           app không gọi được API — mạng chập chờn, tunnel vừa đổi địa chỉ, hoặc máy chủ khởi động
           lại — nên đổi thành chữ đúng sự thật + luôn thử lại tự động. Xem buglog bug-XXX. -->
      <p>Mạng đang chập chờn hoặc máy chủ vừa khởi động lại. App không giới hạn giờ sử dụng — bấm
        "Thử lại" để kết nối lại.</p>
      <button id="offline-retry" class="btn btn-primary">Thử lại</button>
    </div>
  </div>

  <header id="app-header" class="app-header hidden">
    <span id="app-title">POS Manager</span>
    <!-- Đợt 1 (15/08/2026) — breadcrumb chỉ hiện ở giao diện v2, app.js cập nhật trong router() -->
    <span id="app-breadcrumb" class="app-breadcrumb v2-header-only"></span>
    <!-- Việc header (23/08/2026) — sửa theo ảnh mẫu SoBanHang: icon kính lúp + gợi ý phím tắt
         Ctrl K trong ô tìm kiếm, khung kết quả thả xuống (#app-search-results), chuông thông báo
         mở bảng thả xuống thay vì nhảy thẳng trang, khối tài khoản có avatar + tên + vai trò + mũi
         tên mở menu (Cài đặt/Đăng xuất). -->
    <!-- Việc "Website v2" (03/09/2026) — ảnh mẫu Website v2\Tổng quan\*: bấm vào ô tìm kiếm (hoặc
         Ctrl K) mở HỘP THOẠI GIỮA MÀN HÌNH nền mờ: ô nhập nằm trên đầu hộp có nút ×, danh sách
         chia theo nhóm ở giữa, chân hộp ghi "↑↓ chọn · Enter mở · Esc đóng". Bọc thêm 2 lớp
         .app-search-panel / .app-search-field để lúc mở gom được input + kết quả + chân hộp vào
         CÙNG MỘT khối trắng; lúc đóng 2 lớp này trong suốt nên thanh trên trông y như cũ. -->
    <span class="app-search v2-header-only">
      <span class="app-search-panel">
        <span class="app-search-field">
          <svg class="app-search-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.3"/><path d="M15.4 15.4 20.5 20.5"/>
          </svg>
          <input id="app-search" type="search" placeholder="Tìm trang, chức năng..." autocomplete="off">
          <kbd class="app-search-kbd">Ctrl K</kbd>
          <button id="app-search-close" class="app-search-close" type="button" aria-label="Đóng tìm kiếm">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </span>
        <div id="app-search-results" class="app-search-results hidden"></div>
        <div class="app-search-hint">↑↓ chọn · Enter mở · Esc đóng</div>
      </span>
    </span>
    <span class="app-header-right">
      <!-- Việc header (23/08/2026 đợt 2) — nút "?" Trợ giúp (Hướng dẫn sử dụng/Câu hỏi thường gặp)
           theo ảnh mẫu SoBanHang.
           Việc "Website v2" (03/09/2026) — SỬA thứ tự: ảnh mẫu xếp chuông TRƯỚC rồi mới tới "?"
           (tìm kiếm › chuông › ? › tài khoản). Khối chuông nay đứng trên khối "?" trong HTML. -->
      <!-- GĐ8 mục K — chuông Trung tâm thông báo, chấm số do js/app.js cập nhật -->
      <span class="app-notif-wrap">
        <button id="app-notif" class="app-notif hidden" type="button" aria-label="Thông báo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8.5a6 6 0 1 0-12 0c0 6-2 7.5-2 7.5h16s-2-1.5-2-7.5"/>
            <path d="M13.7 20a2 2 0 0 1-3.4 0"/>
          </svg>
          <span id="app-notif-badge" class="app-notif-badge hidden">0</span>
        </button>
        <div id="app-notif-panel" class="app-notif-panel hidden"></div>
      </span>
      <span class="app-help-wrap v2-header-only">
        <button id="app-help" class="app-help" type="button" aria-label="Tro giup">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M9.3 9.3a2.7 2.7 0 1 1 3.9 2.4c-.8.4-1.2.9-1.2 1.8v.3"/>
            <path d="M12 17.2h.01"/>
          </svg>
        </button>
        <div id="app-help-panel" class="app-help-panel hidden"></div>
      </span>
      <span class="app-user-wrap v2-header-only">
        <button id="app-user-chip" type="button" class="app-user-chip">
          <span id="app-user-avatar" class="app-user-avatar"></span>
          <span class="app-user-info">
            <span id="app-user-v2" class="app-user-name"></span>
            <span id="app-user-role" class="app-user-role"></span>
          </span>
          <svg class="app-user-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="app-user-menu" class="app-user-menu hidden"></div>
      </span>
      <span id="app-user"></span>
    </span>
  </header>

  <!-- Cột trái (máy tính) và thanh dưới (điện thoại) do js/app.js dựng từ js/nav.js,
       vì chủ quán tự chọn được 3 ô giữa của thanh dưới (giống app Sổ Bán Hàng). -->
  <nav id="sidebar" class="sidebar hidden"></nav>

  <main id="view" class="view"></main>

  <nav id="tabbar" class="tabbar hidden"></nav>

  <a id="fab" href="#/ban-hang" class="fab hidden" aria-label="Bán hàng nhanh"></a>

  <div id="toast-root" class="toast-root"></div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
