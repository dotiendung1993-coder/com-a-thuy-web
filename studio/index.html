<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Content Studio — Cơm A Thuý</title>
  <meta name="robots" content="noindex">
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center;
           min-height: 100vh; background: #0d0d14; color: #eeeaf8;
           font-family: -apple-system, 'Segoe UI', sans-serif; text-align: center; }
    .box { padding: 32px; }
    .orb { width: 60px; height: 60px; border-radius: 18px;
           background: linear-gradient(135deg,#7c3aed,#c026d3,#f43f5e);
           display: flex; align-items: center; justify-content: center;
           font-size: 28px; margin: 0 auto 16px; box-shadow: 0 12px 36px rgba(192,38,211,.38); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #7b788e; font-size: 14px; margin: 0 0 20px; }
    a { display: inline-block; padding: 10px 22px; border-radius: 10px;
        background: linear-gradient(135deg,#7c3aed,#c026d3);
        color: #fff; font-weight: 700; text-decoration: none; font-size: 14px; }
  </style>
  <!-- Tự sinh bởi scripts/content-tunnel.sh, không sửa tay -->
  <script src="../assets/js/content-config.js"></script>
</head>
<body>
  <div class="box">
    <div class="orb">✍️</div>
    <h1>Content Studio</h1>
    <p id="msg">Đang chuyển hướng…</p>
    <a id="link" href="#">Vào ngay</a>
  </div>
  <script>
    var url = window.CONTENT_APP_PUBLIC_URL;
    if (url) {
      document.getElementById('link').href = url;
      document.getElementById('msg').textContent = 'Đang chuyển hướng đến ' + url.replace(/^https?:\/\//, '') + '…';
      window.location.replace(url);
    } else {
      document.getElementById('msg').textContent = 'Chưa cấu hình địa chỉ tunnel. Khởi động lại content-tunnel để cập nhật.';
      document.getElementById('link').style.display = 'none';
    }
  </script>
</body>
</html>
